name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows NEXA build and checks
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/NexaLauncher.UI/package-lock.json

      - name: Build React UI
        working-directory: src/NexaLauncher.UI
        run: |
          npm ci
          npm run build

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore NexoLauncher.slnx

      - name: Build
        run: dotnet build NexoLauncher.slnx -c Release --no-restore

      - name: Run checks
        run: dotnet run --project tests/NexoLauncher.Core.Tests -c Release --no-build
