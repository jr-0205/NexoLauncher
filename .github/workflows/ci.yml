name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows .NET 10 build and checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexoLauncher.slnx

      - name: Build
        run: dotnet build NexoLauncher.slnx -c Release --no-restore

      - name: Run checks
        run: dotnet run --project tests/NexoLauncher.Core.Tests -c Release --no-build
