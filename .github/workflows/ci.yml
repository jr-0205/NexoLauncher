name: NEXO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build NexoLauncher.slnx --configuration Release
      - name: Test harness
        run: dotnet run --project tests/NexoLauncher.Core.Tests --configuration Release --no-build
