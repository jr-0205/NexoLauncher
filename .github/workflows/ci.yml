name: NEXO CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.202

      - name: Restore
        run: dotnet restore NexoLauncher.slnx

      - name: Build
        run: dotnet build NexoLauncher.slnx --configuration Release --no-restore

      - name: Run checks
        run: dotnet run --project tests/NexoLauncher.Core.Tests --configuration Release --no-build
