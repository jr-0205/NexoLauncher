name: NEXA In-Game Fabric

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'ingame/**'
      - '.github/workflows/ingame-fabric.yml'
  pull_request:
    paths:
      - 'ingame/**'
      - '.github/workflows/ingame-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric:
    name: Fabric ${{ matrix.minecraft }} companion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.19.4'
            project: 'ingame/fabric-1.19.4'
            java: '17'
            gradle: '8.12'
          - minecraft: '1.20.1'
            project: 'ingame/fabric-1.20.1'
            java: '17'
            gradle: '8.12'
          - minecraft: '1.20.4'
            project: 'ingame/fabric-1.20.4'
            java: '17'
            gradle: '8.12'
          - minecraft: '1.20.6'
            project: 'ingame/fabric-1.20.6'
            java: '21'
            gradle: '8.12'
          - minecraft: '1.21.1'
            project: 'ingame/fabric-1.21.1'
            java: '21'
            gradle: '8.12'
          - minecraft: '1.21.4'
            project: 'ingame/fabric-1.21.4'
            java: '21'
            gradle: '8.12'
          - minecraft: '1.21.8'
            project: 'ingame/fabric-1.21.8'
            java: '21'
            gradle: '8.12'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build NEXA In-Game
        run: gradle -p ${{ matrix.project }} build --stacktrace --console=plain

      - name: Upload companion JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ingame-fabric-${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
